name: Sync site files

on:
  push:
    paths:
      - '.sync'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published site
        run: |
          set -e
          base="https://atlasvanguard-bvwax1.freebuff.site"
          mkdir -p assets
          for f in index.html styles.css main.js robots.txt sitemap.xml; do
            curl -fsSL "$base/$f?cb=$GITHUB_RUN_ID" -o "$f"
          done
          for f in logo.png bg-art.jpg; do
            curl -fsSL "$base/assets/$f?cb=$GITHUB_RUN_ID" -o "assets/$f"
          done
          ls -laR
      - name: Commit files
        run: |
          git config user.name "atlasvanguard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html styles.css main.js robots.txt sitemap.xml assets
          git commit -m "Add site files" || echo "nothing to commit"
          git push
